# =====================================================================
#  Nuitka 打包参数（与 packaging/nuitka/build.py 里的命令行参数一一对应）
#
#  这个文件是**说明性配置**：build.py 目前直接拼命令行，改动请以 build.py 为准，
#  这里同步记录关键项，方便查阅"产物到底带了什么"。
# =====================================================================

# 入口：仓库根目录的薄入口（它把 src 加进 sys.path 后转交 xtc_bridge.cli.main）
entry: "main.py"

# 产物：onefile = 单文件；standalone = 目录（启动更快，便于调试）
mode: "onefile"
default_target: "bridge"

# 输出
output_dir: "dist"
output_filename: "xtc-qq-bridge-<版本>-<系统>-<架构>[.exe]"

# 不编译进去的模块（开发/测试用）
exclude_modules:
  - "tests.test_integration"
  - "tests.test_reported_bugs"
  - "tests.test_paths"
  - "tests.selftest"
  - "packaging.nuitka.build"

# 显式包含的包内模块（函数内 import / 可选 import，静态分析容易漏）
include_modules:
  - "xtc_bridge.adb_controller"
  - "xtc_bridge.bridge"
  - "xtc_bridge.xiaotiancai"
  - "xtc_bridge.plugin_client"
  - "xtc_bridge.qq_webhook"
  - "xtc_bridge.msg_log"
  - "xtc_bridge.runtime_paths"
  - "xtc_bridge.version"
  - "xtc_bridge.config"
  - "xtc_bridge.speed_profile"
  - "xtc_bridge.cli.main"
  - "xtc_bridge.utils.logger"
  - "xtc_bridge.utils.deduplicate"
  - "xtc_bridge.utils.imgtool"
  - "xtc_bridge.utils.pngtool"
  - "xtc_bridge.emoji_store"
  - "tools.dump_ui"

# 随包带上的数据文件（相对仓库根目录）
data_files:
  - "config.example.yaml"
  - "assets/keyboardservice-debug.apk"
  - "README.md"
  - "LICENSE"
  - "requirements.txt"
  - "astrbot_plugin_xtc_bridge/_conf_schema.json"
  - "astrbot_plugin_xtc_bridge/main.py"
  - "astrbot_plugin_xtc_bridge/metadata.yaml"
  - "astrbot_plugin_xtc_bridge/plugin_config.example.json"
  - "astrbot_plugin_xtc_bridge/README.md"

# 杂项
follow_imports: false
include_package_yaml: true

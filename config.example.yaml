# =====================================================================
#  xtc-qq-bridge 配置模板
#
#  使用方法：复制本文件为 config.yaml，并按本机实际情况填写各字段。
#  说明：config.yaml 含账号与密钥，已被 .gitignore 排除，请勿提交到版本库。
#  字段含义与取值建议详见 README.md；未填写的字段一律采用程序内置默认值。
# =====================================================================

# ---------------------------------------------------------------------
#  性能档位（建议先选定档位，再按需微调个别参数）
#
#  stable    稳定优先：每条消息均先读取界面再注入，等待与重试最宽松
#  balanced  均衡（默认）：预输入与界面读取互为兜底，适用于多数场景
#  fast      速度优先：缩短等待、提高轮询频率，发送更容易即时取得界面锁
#  turbo     极速：省略大部分等待与重试，失败时会如实上报，不静默重试
#
#  档位仅用于填充默认值：配置文件中显式写出的键不会被档位覆盖
#  （例如：profile 设为 fast 的同时单独指定 xiaotiancai.ui.confirm_delay）。
# ---------------------------------------------------------------------
performance:
  profile: "balanced"
  # force: false                                 # true 时，档位取值会**覆盖**配置文件里显式写出的同名键
                                                 # （默认 false：显式值优先）。用途：配置文件是从旧模板
                                                 # 复制来的，里面残留着 interaction_delay、send_retries、
                                                 # keep_awake_interval、catchup_max_age 这类档位管的键，
                                                 # 于是切换档位时它们纹丝不动 —— 打开本开关即可让档位
                                                 # 一次性接管，不必逐个找出来删掉。

# ---------------------------------------------------------------------
#  ADB 与设备连接（Windows / Linux / macOS 通用）
#
#  设备查找顺序：当前已在线设备 → 环境变量 ADB_SERIAL → 配置端口
#                → 常用 ADB 端口。
#  已在线设备始终优先，不会被后续步骤抢占。
#  实际使用的端口取决于所运行的 Android 运行环境，请以其文档为准。
# ---------------------------------------------------------------------
adb:
  path: ""                                       # adb 可执行文件路径；留空则自动探测
  host: "127.0.0.1"
  port: 5555                                     # ADB 连接端口（取决于运行环境）
  extra_ports: []                                # 额外尝试的端口，例如 [58526]
  serial: ""                                     # 设备序列号；留空则自动选择唯一在线设备
  auto_launch_emulator: false                    # 无法连接时是否自动启动 Android 容器
  heartbeat_interval: 10                         # 连接状态检查间隔（秒）
  disable_animations: true                       # 关闭系统动画；界面动画会导致 uiautomator dump 失败
  keep_awake: true                               # 保持设备常亮；息屏后界面读取会返回空根节点
  # keep_awake_interval: 10                      # 保活指令发送间隔（秒），0 表示关闭
                                                 # 虚拟屏通常约每 50 秒进入休眠，各档位取值 5~10 秒
                                                 # 说明：保活间隔、注入重试次数、界面读取重试次数与间隔
                                                 #       均由 performance.profile 决定；如需单独指定，
                                                 #       取消下列各项的注释即可（显式值优先于档位）。
                                                 #       本模板此前把 keep_awake_interval 写成显式值，
                                                 #       于是复制模板的用户切换档位时该项完全不变。
  # input_retries: 2                             # 文本注入重试轮数
  # dump_retries: 2                              # 界面读取默认重试次数
  # dump_delay: 0.8                              # 界面读取重试间隔（秒，逐轮递增）
  dump_timeout: 60                               # 单次 uiautomator dump 超时（秒）
  # dump_deadline: 0                             # **一次界面读取的总时间上限**（秒，含所有策略与重试）；
                                                 # 0 = 自动取 max(45, dump_timeout × 1.5)。
                                                 # 为什么需要它：设备异常时 5 种读取策略会依次撞满各自的
                                                 # 超时，单次读取最坏可达约 18 分钟，而它全程持有界面锁与
                                                 # 操作锁 —— 期间发送与轮询全部停摆（表现为"桥接没反应"）。
                                                 # 设备很慢又经常超时时可适当调大，但建议不超过 120。
  focus_cache_ttl: 1.5                           # 前台组件缓存有效期（秒），用于减少 dumpsys 调用

# ---------------------------------------------------------------------
#  root 权限（可选，默认关闭）
#
#  设备已 root（Magisk / KernelSU 等）时可经 `su` 读取 App 私有目录，
#  用于更可靠地取得表情与照片的原始文件（Android 11+ 分区存储会让外部目录不可读）。
#  说明：聊天数据库与相关偏好文件由 App 自行加密（SQLCipher），
#        root 也无法读取逐条消息时间，显示时间仍按“标签 + 观测时间”处理。
# ---------------------------------------------------------------------
root:
  enabled: false                                 # 是否使用 root 读取 App 私有目录
  su: "su -c"                                    # su 命令形式（一般无需修改）
  timeout: 30                                    # 单条 su 命令超时（秒）

# ---------------------------------------------------------------------
#  转发（QQ 侧）
# ---------------------------------------------------------------------
forward:
  mode: "plugin"                                 # plugin：经 AstrBot 插件转发；log：仅输出日志
  # 失败补投策略（小天才 → QQ）：
  #   仅对尚未成功的目标补投，已成功的目标不会重复发送；
  #   补投按退避间隔进行，达到次数上限后放弃并记录一条错误。
  #   下列两项由 performance.profile 决定，如需单独指定请取消注释。
  # retry_max_tries: 3                           # 最多补投次数；0 表示不补投
  # retry_backoff: 60                            # 首次补投的等待时间（秒），此后每次乘以 4
  content_dedup_secs: 300                        # 同一联系人的同一内容在多少秒内不重复转发
                                                 # （界面的时间标签可能缺失，以此判重；0 表示关闭）
  plugin:
    base_url: "http://127.0.0.1:11452"           # 需与插件配置的 http_port 一致
    token: "change-me-bridge-token"              # 需与插件配置的 token 一致，建议改为随机串

# ---------------------------------------------------------------------
#  本地消息库（历史消息与“是否已处理”判定的数据来源）
#
#  桥接从最新一条消息向前遍历，遇到库中已有的记录即判定其后消息均已处理。
# ---------------------------------------------------------------------
msg_log:
  cap: 5000                                      # 最多保留条数；0 表示不限制
  shard_size: 2000                               # 每个分库文件的条数；0 表示不分库
  read_shards: 1                                 # 启动时加载的最新分库数量（判定只需最新分库）

# ---------------------------------------------------------------------
#  桥接目标与显示格式
# ---------------------------------------------------------------------
target:
  xtc_contact: ""                                # 小天才 App 中的联系人昵称
  nicknames:                                     # 显示昵称映射（App 昵称 → 转发时显示的昵称）
                                                 # 默认全部注释，启用时去掉行首的 #
    # "小宝": "宝贝"
  default_nickname: ""                           # 未命中映射时的兜底昵称；留空则使用 App 原名
  notify_qq: ""                                  # 登录与异常通知的接收 QQ；留空则取 qq_private 首项
  confirm_delivery: true                         # 送达确认：发送成功后回复“发送成功：[时间] [昵称] 内容”
  qq_private: ""                                 # 转发目标 QQ，单个或列表
  qq_group: ""                                   # 转发目标群，单个或列表（可与 qq_private 并存）

# 消息格式（双向）：
#   小天才 → QQ：[HH:MM] [配置的昵称] 内容（转发至上述全部目标）
#   QQ → 小天才：[HH:MM] [QQ 发送者昵称] 内容（由插件以 /小天才 <文本> 触发，
#                发送者须命中 webhook 白名单）

# ---------------------------------------------------------------------
#  小天才 App
# ---------------------------------------------------------------------
xiaotiancai:
  package: "com.xtc.watch"
  main_activity: ".MainActivity"
  # cmd_prefix: "/"                              # 手表侧命令前缀（默认 /）：改为其它符号可避免与
                                                 # 正常聊天内容冲突，例如 "#"、"//"；留空则命令功能关闭
  # check_interval: 2                            # 轮询间隔（秒），由 performance.profile 决定
  # 漏消息补发：自最新一条向前遍历，将可见范围内尚未入库的消息按时间顺序补发
  #   不再“遇到已入库记录即停止”，以避免新消息遮挡旧消息时旧消息长期漏发
  catchup_missed: true                           # 补发总开关
  catchup_max: 0                                 # 单次最多补发条数；0 表示不限制
  # catchup_max_age: 1800                        # 自动补发的时间窗（秒），各档位均为 30 分钟；0 表示不限制
                                                 # 桥接长时间中断时，该窗口会自动放宽至中断时长，
                                                 # 以免中断期间的消息被整体丢弃；
                                                 # 需要补发更早的消息时，可手动执行 --catchup
                                                 # （本模板此前写成显式值，导致切换档位时该项不变）
  catchup_deep_every: 600                        # 深度扫描间隔（秒）：向上滚动数屏并忽略已处理标记；
                                                 # 用于找回被较新消息遮挡的漏发消息；0 表示关闭
  order_hold_secs: 45                            # 有待取原图的图片或表情时，后续消息最多延后发送的时长
                                                 # （秒），以保证发送顺序；0 表示不延后
  # catchup_scan: 30                             # 每轮最多向上检查的气泡数，由档位决定
  catchup_screens: 1                             # 补发时最多额外向上滚动的屏数；0 表示仅检查可见区域
                                                 # 仅当可见区域内未出现已入库记录时才会滚动，滚动完成后回到底部
  # label_now_window: 300                        # 时间标签距今多少秒内视为“刚刚发生”，显示为当前时间
                                                 # （App 会将时间相近的消息合并为一组，组内后续消息的
                                                 #   标签可能提前 1~2 分钟，刚发生的消息以当前时间更准确）
                                                 # 更早的消息一律使用原始标签，绝不写成补发时刻
  # label_recent_window: 600                      # 标签距今不超过该秒数时，显示用观测时间
                                                 # （App 只给一组消息的第一条画标签，同组后续共用组首时间；
                                                 #   该窗口内改用观测时间，避免 08:19~08:23 全写成 08:19）
  # label_fallback_max: 43200                    # 无标签时，最多向前借用上一条已入库消息时间的秒数
  auto_install_adbkeyboard: true                 # 先检查设备是否已安装输入法；未安装才使用本地 APK
  login:                                         # 账号密码登录（供 /小天才登录 命令与自动检测使用）
    phone: ""                                    # 手机号
    password: ""                                 # 密码（非短信验证码）
    # close_keyboard_before_tap: true            # 点"登录"前是否先按返回键收起键盘（仅在键盘确实
                                                 # 可见时才按）：桥接用的是无界面输入法，此时按返回键
                                                 # 会退回上一页甚至退出 App，可设为 false 彻底关闭
  auto_login: true                               # 自动登录总开关，亦可用 /小天才 自动登录 临时切换
  login_check_interval: 600                      # 登录态复查间隔（秒）
  login_retry_interval: 120                      # 登录超时或网络较慢时的重试间隔（秒）
  login_retry_after_fail: 1800                   # 账号或密码明确错误后的重试间隔（秒）
  login_retry_after_risk: 900                    # 触发安全验证后的重试间隔（秒，等待人工完成）
  login_state_ttl: 5                             # 登录态缓存有效期（秒），用于减少界面读取
  ui:
    # 登录家长账号后可运行 python tools/dump_ui.py 查看实际界面，并据此调整下列字段。
    message_tab_text: "微聊"                     # 聊天列表页的 Tab 文案（精确匹配）
    message_tab_texts: ["微聊", "消息", "聊天"]   # 找不到联系人时依次尝试切换的 Tab 文案
    contact_name_ids: ["tv_chat_dialog_name", "tv_chat_dialog_title", "chat_dialog_name"]
                                                 # 消息列表行中联系人名控件的 id 末段
    contact_preview_ids: ["tv_chat_dialog_last_msg_content", "tv_chat_dialog_last_msg"]
                                                 # 消息列表行中预览控件的 id 末段
    chat_id_hints: ["chat_input", "chat_edit", "et_chat_text", "chat_text_content",
                    "chat_record", "record_button", "send_view", "btn_send", "tv_send",
                    "chat_msg_item", "chatting_input", "edit_chat"]
                                                 # 判定当前页面为聊天页的 id 包含特征
    activity_chat_exclude: ["list", "main", "welcome", "login", "register", "signin",
                            "watchmsg", "msglist", "message"]
                                                 # Activity 名包含这些词时不计为聊天页
    login_markers: ["注册/登录"]                 # 出现这些文案视为未登录
    risk_markers: ["安全验证", "风险", "滑块", "拖动滑块", "图形验证"]
                                                 # 注意：**不要**在这里加"验证码"。登录页底部常驻
                                                 # "短信验证码登录/获取验证码"等文案，含"验证码"的标记会让
                                                 # 每次自动登录在第一轮就被误判成"触发安全验证"，
                                                 # 于是按 login_retry_after_risk（默认 900 秒）挂起等待人工，
                                                 # 而真正的密码错误反而看不出来。代码里也已加了负向保护。
    # 登录失败判定：泛化词仅在“短提示且不含网络相关字眼”时采纳；
    # 含进度语义的文案一律不判为失败。
    login_error_markers: ["密码错误", "账号不存在", "手机号不存在", "错误", "失败", "次数过多"]
    login_progress_markers: ["登录中", "正在登录", "正在验证", "验证中", "正在提交", "请稍候",
                             "请稍后", "正在加载", "加载中", "处理中", "请等待"]
    login_timeout: 45                            # 等待登录结果的最长时间（秒）；超时按稍后重试处理
    input_resource_id: "com.xtc.watch:id/et_chat_text_content"
    send_resource_id: "com.xtc.watch:id/tv_send_view"
    send_texts: ["发送"]
    # interaction_delay: 0.6                     # 点击与输入之间的等待时间（秒），由档位决定
                                                 # （stable 0.8 / balanced 0.6 / fast 0.45 / turbo 0.3）
                                                 # 本模板此前写成显式值，导致切换档位时该项不变
    # send_retries: 2                            # 发送确认失败后的重试轮数，由档位决定（1~3）
                                                 # 仅当输入框仍留有内容时才重发，不会产生重复消息
    # 发送提速：设备上一次界面读取约需 3~4 秒，因此关键在于减少读取次数。
    # 下列各项由 performance.profile 决定，如需单独指定请取消注释（显式值优先于档位）。
    # fast_send: true                            # 布局未变时直接注入文本并点击缓存坐标，省去一次读取
    # snapshot_reuse: 3.0                        # 复用最近界面快照的时长（秒），0 表示不复用
    # confirm_delay: 0.8                         # 点击发送后等待多久再确认（秒）
    # blind_send: true                           # 预输入：按上次成功发送的坐标直接输入并点击发送，
                                                 # 不等待轮询完成界面读取；关闭后每条消息均先读取界面
    send_fail_markers: ["发送失败", "发送不成功", "未发送", "网络异常", "网络不可用", "发送异常", "无法发送"]
    popup_skip_texts: ["以后再说", "稍后再说", "暂不更新", "不更新", "稍后更新", "下次再说", "暂不升级", "忽略此版本", "取消", "关闭"]
    # 下列文案对应的按钮会触发下载、安装、更新或重启，自动关闭弹窗时不得点击
    popup_block_texts: ["立即安装", "马上安装", "现在安装", "去安装", "确认安装", "下载安装", "立即更新", "马上更新", "立即升级", "马上升级", "现在升级", "去升级", "立即重启", "去评分", "给个好评", "同意并安装"]
    anr_wait_texts: ["等待", "等待响应", "继续等待"]
    chat_junk_texts: ["发送", "表情", "语音", "拍照", "更多", "已读", "撤回", "按住说话", "试试和宝贝聊天吧", "试试将作业要求发送给宝贝吧"]
    system_msg_prefixes: ["发送成功", "发送失败"]   # 桥接自身系统提示的前缀，读取时跳过；不可留空项
    # 下列各项此前只在代码里生效、模板中没有记录，现补齐（均可省略，值即默认值）：
    filter_own_bubbles: true                     # 转发时过滤掉"自己（家长侧）发的"气泡，避免回声；
                                                 # 关掉后家长在小天才里说的话也会被转发到 QQ。
                                                 # 注意：家长侧命令（/小天才 …）的识别不受本开关影响
    own_side_ratio: 0.55                         # 判定"自己发的气泡"的横向比例：气泡中心超过
                                                 # 屏宽 × 该值即视为己方。横屏/平板/折叠屏或界面
                                                 # 布局偏窄的机型需要调整（0.30~0.90）；调错的表现为
                                                 # 己方消息被当成孩子消息转发回 QQ（回声）
    input_hint_texts: ["发送文字", "发送消息", "输入内容", "说点什么", "输入消息", "发消息"]
                                                 # 输入框为空时显示的占位提示（dump 出来的 text 就是它）：
                                                 # 命中时视为"输入框是空的"，否则清残留与发送确认都会把
                                                 # 提示文案当成用户输入（实机测试发现）。App 改版后需同步
    main_ui_markers: ["微聊", "消息", "我的", "联系人", "聊天", "设置", "发现"]
                                                 # 判定"已回到小天才主界面"的文案特征（命中 2 个及以上）：
                                                 # 用于异常恢复后确认 App 状态
  popup:                                         # 自动关闭弹窗/遮挡（权限、更新、无响应、网络异常等）
    # max_passes: 6                              # 单次清理最多轮数（每轮一次界面读取，约 3 秒）；
                                                 # 界面锁会被占住整段时间，设备很慢时可减小
    # pass_delay: 0.5                            # 每轮之间的等待时间（秒），等弹窗动画结束
                                                 # 说明：同一个点了没反应的弹窗会被自动识别并停止重复点击，
                                                 #       不再把 max_passes 全部耗尽（此前最多空占锁约 20 秒）

# ---------------------------------------------------------------------
#  日志
# ---------------------------------------------------------------------
logging:
  level: "INFO"
  file: "logs/xtc-qq-bridge.log"                 # 文件名主干，实际文件名会追加启动时间
  per_run: true                                  # 每次启动新建日志文件（logs/xtc-qq-bridge-YYYYmmdd-HHMMSS.log）
                                                 # 设为 false 则始终追加至同一文件
  keep_runs: 0                                   # 0 表示从不清理；设为 N 则仅保留最近 N 次启动的日志

# ---------------------------------------------------------------------
#  反向回调（QQ → 小天才）
#
#  白名单为严格模式：私聊依据 allow_from，群聊依据 allow_groups；对应列表为空时该类消息全部拒绝。
#  该白名单同时决定 xtc 侧命令（/小天才 搜索、在线人数、提醒）的统计范围。
# ---------------------------------------------------------------------
webhook:
  enabled: true
  host: "127.0.0.1"
  port: 5000
  path: "/qq_callback"
  token: "change-me-webhook-token"               # 需与插件配置的 python_callback_token 一致
  allow_from: []                                 # 允许触发 /小天才 的私聊 QQ 号
  allow_groups: []                               # 允许触发 /小天才 的群号

# ---------------------------------------------------------------------
#  表情与图片转发（仅 小天才 → QQ 单向）
#
#  小天才发送的表情贴纸与照片均以图片形式转发至 QQ；QQ → 小天才仍为文本。
#  表情取图顺序：① App 数据目录或图片缓存中的原文件（保留动图，并与界面气泡比对像素）
#                ② 气泡截图
#                ③ 以“表情X”文本形式发送，确保消息不丢失
#  照片取图顺序：① App 聊天照片目录中的原图
#                ② 图片缓存中的原图（需形状一致且时间匹配）
#                ③ 气泡截图
#  均无法取得时暂不发送，按下列参数重试。
# ---------------------------------------------------------------------
emoji:
  forward_image: true                            # 关闭后表情仅发送文本，照片仅发送“图片”二字
  forward_photo: true                            # 照片是否获取原图；关闭后仅发送气泡截图
  caption: true                                  # 图片是否附带说明（[时间] [昵称] 内容）
  from_app_data: true                            # 是否从 App 数据目录或图片缓存获取原图（推荐开启）
  match_ok: 0.80                                 # 表情原图与界面气泡的相似度阈值（0~1）
                                                 # 实测同一表情通常高于 0.95，无关图片为 0.5~0.63；
                                                 # 降低阈值可识别更多表情，但存在误判风险
  # 下列三项由 performance.profile 决定，如需单独指定请取消注释
  # wait_retries: 8                              # 原图尚未就绪时的最大重试次数（间隔逐次翻倍）
  # wait_base: 5                                 # 首次等待时间（秒），此后为 10、20、40……
  # wait_max_secs: 1800                          # 最长等待时间（秒），超时后改为发送文本
  # lock_timeout: 8                              # 取表情原图时等待操作锁的最长秒数：锁被发送/导航
                                                 # 占用时最多等这么久，超时本轮跳过、下轮再取。
                                                 # 设备很慢又经常"表情只剩文字"时可调大
